name: Automated Daily Commits

on:
  schedule:
    - cron: '20 11,17 * * *'
  workflow_dispatch: 

jobs:
  make-commits:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Human-Like Commits
        run: |
          # Pool of realistic, varied human commit messages
          MESSAGES=(
            "fix: handle edge case in data parsing utility"
            "refactor: optimize loop performance in helper module"
            "docs: add clarification to function parameters"
            "style: clean up indentation and trailing spaces"
            "chore: update internal tracking notes"
            "feat: add initial skeleton for upcoming helper"
            "fix: correct minor typo in comments"
          )
          
          # Randomly decide to make 1 or 2 commits to vary daily patterns
          NUM_COMMITS=$(( ( RANDOM % 2 )  + 1 ))
          echo "Generating $NUM_COMMITS human-like commits"
          
          touch scratchpad.js
          
          for i in $(seq 1 $NUM_COMMITS)
          do
            # Pick a random message from the array
            RANDOM_INDEX=$(( RANDOM % ${#MESSAGES[@]} ))
            COMMIT_MSG="${MESSAGES[$RANDOM_INDEX]}"
            
            # Append a realistic timestamped code comment instead of raw logs
            echo "// Updated at $(date +'%Y-%m-%d %H:%M:%S') - routine maintenance" >> scratchpad.js
            
            git add scratchpad.js
            git commit -m "$COMMIT_MSG"
            
            # Random pause to mimic natural development pacing
            sleep $(( ( RANDOM % 5 ) + 3 ))
          done

      - name: Push Changes
        run: git push
