name: Automated Daily Commits

on:
  schedule:
    # Runs twice daily (UTC)
    # 16:20 UTC = 9:20 PM PKT
    # 18:20 UTC = 11:20 PM PKT
    - cron: "20 16,18 * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  make-commits:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Configure Git Identity
        run: |
          git config --global user.name "Qurban Hanif"
          git config --global user.email "qurbanhanif120@gmail.com"


      - name: Create Meaningful Maintenance Commit
        run: |

          FILE="maintenance/daily-update.md"

          mkdir -p maintenance

          touch $FILE


          MESSAGES=(
            "chore: update daily maintenance log"
            "docs: improve project documentation notes"
            "refactor: optimize internal utilities"
            "chore: maintain project consistency"
            "fix: improve minor code quality"
            "docs: update development notes"
          )


          COUNT=$(( RANDOM % 2 + 1 ))

          echo "Creating $COUNT commits"


          for i in $(seq 1 $COUNT)
          do

            INDEX=$(( RANDOM % ${#MESSAGES[@]} ))

            MESSAGE="${MESSAGES[$INDEX]}"


            echo "
## Daily Maintenance

Updated:
$(date '+%Y-%m-%d %H:%M:%S')

Routine project maintenance.
" >> $FILE


            git add $FILE


            git commit \
            --author="Qurban Hanif <qurbanhanif120@gmail.com>" \
            -m "$MESSAGE"


            sleep $(( RANDOM % 10 + 5 ))

          done



      - name: Push Changes
        run: |

          git push origin HEAD:main
