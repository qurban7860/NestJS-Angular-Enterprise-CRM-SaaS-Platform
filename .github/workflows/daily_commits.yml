name: Automated Daily Commits

on:
  schedule:
    # Runs at 08:00 UTC every day. 
    # You can change this to any time using CRON syntax.
    - cron: '0 8 * * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch: 

jobs:
  make-commits:
    runs-on: ubuntu-latest
    permissions:
      # Git is required to write to the repository
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Fetches entire history so we can push back seamlessly
          fetch-depth: 0 

      - name: Setup Git Config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate Distinct Commits
        run: |
          # Define how many commits you want (2 or 3)
          NUM_COMMITS=$(( ( RANDOM % 2 )  + 2 ))
          
          echo "Generating $NUM_COMMITS commits"
          
          # Ensure the log file exists
          touch contribution_log.txt
          
          for i in $(seq 1 $NUM_COMMITS)
          do
            # Create a unique change using date and nanoseconds + loop index
            echo "Contribution update: $(date +'%Y-%m-%d %H:%M:%S:%N') - commit $i" >> contribution_log.txt
            
            # Stage the file
            git add contribution_log.txt
            
            # Commit with a varying message to ensure they are distinct commits
            git commit -m "chore: automated daily update $(date +'%Y-%m-%d') [part $i]"
            
            # Optional: Small pause to ensure timestamps are slightly different
            sleep 2
          done

      - name: Push Changes
        run: git push
