name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_ci
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/crm_ci
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build NestJS backend
        run: npm run build

      - name: Run backend unit tests
        run: npm test -- --runInBand

      - name: Run non-mutating lint on changed TypeScript source
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          base_sha="$BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git -C .. rev-parse HEAD^)"
          fi

          mapfile -t changed_files < <(
            git -C .. diff --name-only --diff-filter=ACMR "$base_sha" "$HEAD_SHA" -- backend/src \
              | sed -n '/^backend\/.*\.ts$/s#^backend/##p'
          )

          if (("${#changed_files[@]}" == 0)); then
            echo "No changed TypeScript source files; skipping incremental lint."
            exit 0
          fi

          printf 'Linting %s changed TypeScript file(s):\n' "${#changed_files[@]}"
          printf ' - %s\n' "${changed_files[@]}"
          npm run lint:check -- "${changed_files[@]}"
